[workspace]
resolver = "2"
members = [
    "lib",
    "cli",
    "generate",
    "common",
    "document"
]

[profile.dev]
codegen-units = 1 # faster builds
incremental = true
lto = true
panic = "abort"

[profile.release]
opt-level = 3
debug = false
rpath = false
lto = false
debug-assertions = false
panic = 'unwind'
incremental = false
overflow-checks = false
strip = true

