[package]
name = "cli"
version = "0.1.0"
authors = []
edition = "2021"
default-run = "lubra"

[dependencies]
lib = { path = "../lib" }

[[bin]]
name = "lubra"
path = "src/main.rs"


#
# https://www.zero2prod.com/assets/sample_zero2prod.pdf
#
# On MacOS, `brew install michaeleisel/zld/zld`
[target.x86_64-apple-darwin]
rustflags = ["-C", "link-arg=-fuse-ld=/usr/local/bin/zld"]
[target.aarch64-apple-darwin]
rustflags = ["-C", "link-arg=-fuse-ld=/usr/local/bin/zld"]
