[registries.crates-io]
protocol = "sparse"

[workspace]
members = [
    "lib",
    "cli",
    "generate"
]

[profile.release]
opt-level = 3
debug = false
rpath = false
lto = false
debug-assertions = false
codegen-units = 16
panic = 'unwind'
incremental = false
overflow-checks = false
strip = true


[build]
rustflags = ["-C", "target-cpu=native", "target-feature=+crt-static"]
