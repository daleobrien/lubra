[workspace]
resolver = "2"
members = [
    "lib",
    "cli",
    "generate",
    "common",
    "document"
]

[profile.dev]
codegen-units = 16 # faster builds
incremental = true

[profile.release]
opt-level = 3
debug = false
rpath = false
lto = false
debug-assertions = false
codegen-units = 1 # faster build, slower code, set to 1
panic = 'unwind'
incremental = false
overflow-checks = false
strip = true

