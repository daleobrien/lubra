# cargo-features = ["codegen-backend"]
[workspace]
resolver = "2"
members = ["lib", "cli", "generate", "common", "document"]

[profile.dev]
#codegen-units = 256 # faster builds
#incremental = true
#lto = false
#panic = "abort"
#debug = 0

[profile.release]
opt-level = 3
debug = false
rpath = false
lto = false
debug-assertions = false
panic = 'unwind'
incremental = false
overflow-checks = false
strip = true


[build]
rustflags = ["-C", "target-cpu=native", "target-feature=+crt-static"]
