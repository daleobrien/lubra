[package]
name = "lib"
version = "0.1.0"
authors = []
edition = "2021"

[dependencies]
common = { path = "../common" }
rand_distr = "0.4.3"
rand = "0.8.5"
array2d = "0.2.1"
rand_chacha = "0.3.1"
phf = { version = "0.13.1", features = ["macros"] }
weighted_rand = "0.4.2"
# PNG output (`png`, on by default). Off for WebAssembly, which only needs SVG.
usvg = { version = "0.40.0", optional = true }
tiny-skia = { version = "0.11.4", optional = true }
resvg = { version = "0.40.0", optional = true }

[features]
default = ["png"]
png = ["dep:usvg", "dep:tiny-skia", "dep:resvg"]
