[workspace]
resolver = "2"
members = [
    "lib",
    "cli",
    "generate",
    "common"
]

[build]
rustflags = ["-Z", "threads=12"]

[profile.release]
opt-level = 3
debug = false
rpath = false
lto = false
debug-assertions = false
codegen-units = 16
panic = 'unwind'
incremental = false
overflow-checks = false
strip = true

