[package]
name = "cli"
version = "0.1.0"
authors = []
edition = "2021"

[dependencies]
lib = { path = "../lib" }

[profile.release]
opt-level = 3
debug = false
rpath = false
lto = false
debug-assertions = false
codegen-units = 16
panic = 'unwind'
incremental = false
overflow-checks = false
strip = "debuginfo"

[[bin]]
name = "sim"
path = "src/main.rs"